dependencies:
  cmd_system:
    path: ${IDF_PATH}/examples/system/console/advanced/components/cmd_system
  cmd_nvs:
    path: ${IDF_PATH}/examples/system/console/advanced/components/cmd_nvs
  # Same versions as the clock firmware (../../dependencies.lock): the C6 image
  # must be built from this exact esp_hosted version.
  espressif/esp_wifi_remote:
    version: "1.6.3"
    rules:
      - if: "target in [esp32p4, esp32h2]"
      - if: "idf_version <6.1"
  espressif/esp_hosted:
    version: "2.13.1"
    rules:
      - if: "target in [esp32p4, esp32h2]"
  joltwallet/littlefs:
    version: "*"
