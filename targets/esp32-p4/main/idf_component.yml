dependencies:
  idf:
    version: ">=5.5"
  waveshare/esp32_p4_wifi6_touch_lcd_xc:
    version: "^3.0.1"
  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"
    rules:
      - if: "target == esp32p4"
  # Keep in step with the firmware on the ESP32-C6 (tools/c6-firmware-update):
  # host and co-processor should run the same esp_hosted major.minor.
  espressif/esp_hosted:
    version: "~2.13.1"
    rules:
      - if: "target == esp32p4"
  # http://weerklok-<room>.local/ for the web page
  espressif/mdns:
    version: "^1.8"
  espressif/esp_codec_dev:
    version: "^1.3"
